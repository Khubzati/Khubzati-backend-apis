name: Backend CI

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Start smoke check
        env:
          NODE_ENV: development
          ENABLE_STUB_RESPONSES: "false"
          CORS_ORIGINS: http://localhost:3004
        run: |
          set +e
          timeout 20s npm start > /tmp/backend-start.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            cat /tmp/backend-start.log
            exit "$code"
          fi
